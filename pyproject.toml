[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mimoe-qa-agent"
version = "1.0.0"
description = "A local QA agent that pairs API assertion evidence with mimOE model analysis."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Victor Salmon" }]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/victorsalmon/mimoe-qa-agent"
Repository = "https://github.com/victorsalmon/mimoe-qa-agent"
Issues = "https://github.com/victorsalmon/mimoe-qa-agent/issues"

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "black>=24.0",
]

[project.scripts]
mimoe-qa = "mimoe_qa.cli:main"

[tool.setuptools.packages.find]
include = ["mimoe_qa*"]

[tool.setuptools.package-data]
mimoe_qa = ["demo_suite.json"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["E501"]

[tool.black]
line-length = 120
target-version = ["py311"]
