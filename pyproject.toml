[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mimoe-qa-agent"
version = "1.0.0"
description = "A local QA agent that pairs API assertion evidence with mimOE model analysis."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mimoe-qa = "mimoe_qa.cli:main"

[tool.setuptools.packages.find]
include = ["mimoe_qa*"]

[tool.setuptools.package-data]
mimoe_qa = ["demo_suite.json"]
