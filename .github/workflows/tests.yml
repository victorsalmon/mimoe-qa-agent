name: Offline tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dev tools
        run: python -m pip install --quiet --disable-pip-version-check ".[dev]"
      - name: Lint (ruff, line-length 120)
        run: python -m ruff check .
      - name: Test without mimOE or external services
        run: python -m unittest discover -v
      - name: Check packaging and CLI
        run: |
          python -m pip install .
          mimoe-qa --help
